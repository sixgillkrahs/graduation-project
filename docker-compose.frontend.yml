services:
  uaa:
    build:
      context: .
      dockerfile: front-end/uaa/Dockerfile
      args:
        APP_DIR: front-end/uaa
        LIB_DIR: library/gra-helper
        BUILD_SCRIPT: build:prod
    image: graduation-project/uaa:latest
    container_name: graduation-project-uaa
    restart: unless-stopped
    ports:
      - "5173:8080"

  landing-page:
    build:
      context: .
      dockerfile: front-end/real-estate-landing-page/Dockerfile
      args:
        APP_DIR: front-end/real-estate-landing-page
        LIB_DIR: library/gra-helper
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080/api
        NEXT_PUBLIC_API_BASE_SOCKET: http://localhost:8080
        INTERNAL_API_BASE_URL: http://host.docker.internal:8080/api
        NEXT_PUBLIC_BASEURLAI: http://localhost:8082
        INTERNAL_AI_BASE_URL: http://host.docker.internal:8082
        NEXT_PUBLIC_ENVIRONMENT: production
    image: graduation-project/landing-page:latest
    container_name: graduation-project-landing-page
    env_file:
      - ./front-end/real-estate-landing-page/.env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    ports:
      - "3000:3000"
